name: ci
on:
  push: { branches: [master, main], tags: ["v*"] }
  pull_request:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu   # CPU wheel; the dev extra then sees torch as satisfied
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4            # models and data built by the next step; keyed on everything they depend on
        with:
          path: |
            artifacts
            data
          key: models-edge-${{ hashFiles('config/**', 'skinflow_discard_optimizer/sim/scenarios/**', 'skinflow_discard_optimizer/core/**', 'skinflow_discard_optimizer/sim/**') }}
      - run: skdo bootstrap
        env: { SKDO_TIER: edge }
      - run: pytest -m "not slow"
        env: { SKDO_TIER: edge }
      - run: pytest -m slow
        env: { SKDO_TIER: edge }

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6   # CPU image; pushed only for version tags
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6   # GPU image
        with:
          context: .
          build-args: EXTRAS=gpu
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}-gpu
          cache-from: type=gha
