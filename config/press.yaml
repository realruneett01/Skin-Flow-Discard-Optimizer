# Press geometry, kinematics and sensor model for the simulator and the physics model.
# Press size follows the DCTO reference press (28 MN, 228 mm billet, 850 mm long).

geometry:
  container_bore_mm:
    value: 235.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Assumed bore for a 228 mm billet (typical 5-8 mm upset clearance). Billet diameter from DCTO PressConfig"
  billet_diameter_mm:
    value: 228.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "DCTO simulator/press_config.py nominal_billet_diameter_mm"
  billet_length_mm:
    value: 850.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "DCTO simulator/press_config.py nominal_billet_length_mm"
  billet_length_sd_mm:
    value: 6.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Assumed saw-cut length variation"
  extrusion_ratio:
    value: 40.0
    unit: "-"
    status: PLACEHOLDER
    SOURCE: "Assumed typical 6xxx profile extrusion ratio; per die in scenarios"

hydraulics:
  cap_area_mm2:
    value: 1.05e6
    unit: mm^2
    status: PLACEHOLDER
    SOURCE: "Sized so 28 MN is reached at ~267 bar cap pressure (28e6 N / 26.7 MPa)"
  rod_area_mm2:
    value: 1.4e5
    unit: mm^2
    status: PLACEHOLDER
    SOURCE: "Assumed return-side annulus area"
  rod_back_pressure_bar:
    value: 8.0
    unit: bar
    status: PLACEHOLDER
    SOURCE: "Assumed tank-line back pressure on the rod side during extrusion"
  rated_force_N:
    value: 28.0e6
    unit: N
    status: PLACEHOLDER
    SOURCE: "DCTO PressConfig.rated_tonnage_mn = 28"
  pump_overall_efficiency:
    value: 0.85
    unit: "-"
    status: PLACEHOLDER
    SOURCE: "Assumed axial piston pump overall efficiency (HPEO caps at 0.95 and uses 0.85 for its baseline proxy)"
  supply_pressure_nominal_bar:
    value: 300.0
    unit: bar
    status: PLACEHOLDER
    SOURCE: "Assumed HPU relief/supply setting; HPEO peaks near 280-320 bar"

kinematics:
  ram_speed_mm_s:
    value: 12.0
    unit: mm/s
    status: PLACEHOLDER
    SOURCE: "Assumed; gives ~70 s extrusion for 850 mm, close to DCTO's 65 s extrusion phase"
  ram_speed_sd_mm_s:
    value: 0.8
    unit: mm/s
    status: PLACEHOLDER
    SOURCE: "Assumed billet-to-billet speed variation"
  accel_time_constant_s:
    value: 0.5
    unit: s
    status: PLACEHOLDER
    SOURCE: "Assumed ram acceleration time constant"
  stroke_end_thickness_mm:
    value: 8.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Simulator runs each stroke to this remaining thickness so the whole end-of-stroke shape is known; not a recommendation"

thermal:
  billet_temp_C:
    value: 470.0
    unit: degC
    status: PLACEHOLDER
    SOURCE: "Typical 6063 billet front temperature"
  billet_temp_sd_C:
    value: 6.0
    unit: degC
    status: PLACEHOLDER
    SOURCE: "Assumed furnace variation"
  taper_K:
    value: 25.0
    unit: K
    status: PLACEHOLDER
    SOURCE: "Assumed front-to-back taper for isothermal extrusion"
  deformation_heating_K:
    value: 30.0
    unit: K
    status: PLACEHOLDER
    SOURCE: "Assumed bulk temperature rise from deformation work"
  heating_length_mm:
    value: 120.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Assumed stroke length over which deformation heating builds up"
  liner_temp_C:
    value: 430.0
    unit: degC
    status: PLACEHOLDER
    SOURCE: "Typical container liner set point ~30-50 K below billet"

tooling:
  F_tool_N:
    value: 0.6e6
    unit: N
    status: PLACEHOLDER
    SOURCE: "Assumed stem/dummy-block/die-support losses"

transients:
  fill_length_mm:
    value: 3.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Assumed upset (container fill) length; simulator-only realism, not in plan formula"
  entry_amplitude_frac:
    value: 0.06
    unit: "-"
    status: PLACEHOLDER
    SOURCE: "Assumed dummy-block entry / breakthrough peak as fraction of initial force; simulator-only"
  entry_length_mm:
    value: 8.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Assumed stroke position of the breakthrough peak; decays within ~5% of stroke"

upturn:
  amplitude_at_onset_N:
    value: 0.25e6
    unit: N
    status: PLACEHOLDER
    SOURCE: "Assumed size of F_up at the skin-flow onset thickness"
  decay_length_mm:
    value: 6.0
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Assumed lam in F_up(h) = a_up*exp(-h/lam)"
  drop_fraction:
    value: 0.08
    unit: "-"
    status: PLACEHOLDER
    SOURCE: "Assumed size of the alternative 'force drops' shape from the source spec"

sensors:
  sample_rate_hz:
    value: 1000.0
    unit: Hz
    status: PLACEHOLDER
    SOURCE: "Plan section 1.2 (1 kHz)"
  pressure_noise_bar:
    value: 0.35
    unit: bar
    status: PLACEHOLDER
    SOURCE: "Assumed transducer + electrical noise, 1 kHz"
  position_noise_mm:
    value: 0.02
    unit: mm
    status: PLACEHOLDER
    SOURCE: "Assumed linear encoder noise"
  temp_noise_C:
    value: 1.0
    unit: degC
    status: PLACEHOLDER
    SOURCE: "Assumed thermocouple noise"
